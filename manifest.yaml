---
# MySQL StatefulSet for Identity
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-mysql
  namespace: production
spec:
  serviceName: identity-mysql
  replicas: 3
  selector:
    matchLabels:
      app: identity-mysql
  template:
    metadata:
      labels:
        app: identity-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: identity-secret
              key: DATABASE_PASSWORD
        - name: MYSQL_DATABASE
          value: identity_service
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi
---
# MongoDBReplicaSet (using Operator) - sample CRD
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: profile-mongo
  namespace: production
spec:
  members: 3
  version: "6.0.4"
  type: ReplicaSet
  security:
    authentication:
      modes: [SCRAM]
  users:
  - name: profile-user
    db: admin
    passwordSecretRef:
      name: profile-secret
  statefulSet:
    volumeClaimTemplates:
    - metadata:
        name: data-volume
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
# Neo4j Causal Cluster (using Operator)
apiVersion: neo4j.com/v1
kind: Neo4j
metadata:
  name: profile-neo4j
  namespace: production
spec:
  core:
    size: 3
    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
    volumeSize: 20Gi
  readReplica:
    size: 2
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
    volumeSize: 10Gi
  acceptLicenseAgreement: true
