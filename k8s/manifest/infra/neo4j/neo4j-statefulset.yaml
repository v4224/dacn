apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j-profile
  namespace: infra
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j-profile
  template:
    metadata:
      labels:
        app: neo4j-profile
    spec:
      containers:
      - name: neo4j
        image: neo4j:5
        env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: neo4j-secret
              key: auth
        ports:
        - containerPort: 7687
          name: bolt
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi