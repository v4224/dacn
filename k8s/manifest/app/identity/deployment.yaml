apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
      - name: identity
        image: hoangvu42/identity:v1
        ports:
          - containerPort: 8080
        envFrom:
          - configMapRef:
              name: identity-config
          - secretRef:
              name: identity-secret
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "700m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5