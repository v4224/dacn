apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile
  template:
    metadata:
      labels:
        app: profile
    spec:
      containers:
      - name: profile
        image: hoangvu42/profile:v1
        ports:
          - containerPort: 8081
        envFrom:
          - configMapRef:
              name: profile-config
          - secretRef:
              name: profile-secret
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "600m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 5