apiVersion: v1
kind: ConfigMap
metadata:
  name: profile-config
  namespace: app
data:
  application.yml: |
    server:
      port: 8081
      servlet:
        context-path: /profile

    spring:
      application:
        name: profile-service

      neo4j:
        uri: bolt://neo4j-profile.infra.svc.cluster.local:7687
        authentication:
          username: ${NEO4J_USERNAME}
          password: ${NEO4J_PASSWORD}