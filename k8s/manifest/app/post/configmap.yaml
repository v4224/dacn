apiVersion: v1
kind: ConfigMap
metadata:
  name: post-config
  namespace: app
data:
  application.yml: |
    server:
      port: 8083
      servlet:
        context-path: /post

    spring:
      application:
        name: post-service
      data:
        mongodb:
          uri: ${MONGODB_CONNECTION}

    app:
      services:
        profile:
          url: http://profile-service.app.svc.cluster.local:8081/profile